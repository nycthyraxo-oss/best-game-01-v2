<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Harvest</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060f; }
  #game { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Nova Harvest: fly the skiff Kestrel with WASD, aim with the mouse, fire with click or Space, dash with Shift"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
